spring:

  application:
    name: ai-marketplace-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/aimarketplace_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        model: llama3.2

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile

server:
  port: 8080

jwt:
  secret: un5t45uxmgc5894hg498c5tygjhx4c5y85c87hyvb9c5mncjt3uc5
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: DEBUG